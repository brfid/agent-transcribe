[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-transcribe"
version = "1.0.0"
description = "Local archival scan extraction, descriptive filing, and preferred-text reading"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX",
  "Topic :: Text Processing",
]

[project.urls]
Repository = "https://github.com/brfid/agent-transcribe"
Documentation = "https://github.com/brfid/agent-transcribe#readme"
Issues = "https://github.com/brfid/agent-transcribe/issues"

[project.optional-dependencies]
images = ["Pillow>=10"]

[project.scripts]
agent-transcribe = "agent_transcribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_transcribe*"]
