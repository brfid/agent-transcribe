name: Synthetic tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local OCR tools and synthetic-fixture font
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils ocrmypdf fonts-dejavu-core
      - name: Install package with optional image support
        run: python -m pip install '.[images]' 'ocrmypdf>=17,<18'
      - name: Check installed command and synthetic suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          agent-transcribe --help
          python -m unittest discover -s tests -v
